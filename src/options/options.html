<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NoNoise Settings</title>
  <link rel="stylesheet" href="../styles/global.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(120% 80% at 50% 0%, #1c1a2d 0%, #0d0c13 100%);
      color: #e4e2f0;
      display: flex;
      justify-content: center;
      padding: 48px 20px;
    }
    .container {
      width: 100%;
      max-width: 520px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    header svg {
      width: 22px;
      height: 22px;
      color: #724ae8;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      color: #ffffff;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(114, 74, 232, 0.16);
      border-radius: 14px;
      padding: 18px 20px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin: 0 0 14px 0;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      font-size: 13.5px;
      color: #c9c7d4;
    }
    li:last-child {
      border-bottom: none;
    }
    li button {
      background: #221f35;
      color: #e4e2f0;
      border: 1px solid #353152;
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    li button:hover {
      background: #3b2434;
      border-color: #7f3954;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img src="../../assets/icons/icon48.png" alt="NoNoise" style="width: 26px; height: 26px; border-radius: 6px;">
      <h1>NoNoise Settings</h1>
    </header>

    <div class="card">
      <p class="card-title">Whitelisted Sites</p>
      <ul id="whitelistList"></ul>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
